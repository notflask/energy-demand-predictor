[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "energy-demand-predictor"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "numpy>=2.5.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
